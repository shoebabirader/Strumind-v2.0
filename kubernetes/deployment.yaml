apiVersion: apps/v1
kind: Deployment
metadata:
  name: strumind-backend
  labels:
    app: strumind
    component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: strumind
      component: backend
  template:
    metadata:
      labels:
        app: strumind
        component: backend
    spec:
      containers:
      - name: backend
        image: strumind/backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: strumind-secrets
              key: database-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: strumind-secrets
              key: jwt-secret
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: strumind-backend-service
spec:
  selector:
    app: strumind
    component: backend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
  type: LoadBalancer
